services:
  db:
    image: postgres:17-alpine
    container_name: flow-api-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowdb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flow

  flow-api:
    container_name: flow-api
    build:
      context: ./core
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./core:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flow

  reconciliation:
    container_name: flow-reconciliation
    build:
      context: ./reconciliation
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8001:8000"
    networks:
      - flow

volumes:
  pgdata:
  node_modules:

networks:
  flow:
    name: flow
