[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-reconciliation"
version = "0.1.0"
description = "Reconciliation service for invoice-to-bank-transaction matching"
requires-python = ">=3.13"
authors = [{name = "Flow", email = "hello@marvinkweyu.net"}]

dependencies = [
  "strawberry-graphql[asgi]",
  "sqlalchemy==2.0.25",
  "alembic==1.13.1",
  "psycopg[binary,pool]==3.2.13",
  "uvicorn==0.25.0",
  "python-dateutil==2.8.2",
  "pydantic",
  "pytest",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.3",
  "pytest-asyncio==0.21.1",
]


